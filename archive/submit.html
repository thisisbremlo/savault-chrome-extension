<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit a find - savault</title>
  <link rel="stylesheet" href="archive.css" />
  <link rel="stylesheet" href="submit.css" />
</head>

<body>
  <div class="app submit-app">
    <header class="header">
      <button type="button" class="brand" id="brand-btn" aria-label="savault home">

        </svg>
      </button>
      <nav class="header-nav" aria-label="savault actions">
      </nav>
      <div class="header-actions">
        <button type="button" id="personal-vault-btn" class="open-link">My vault</button>
        <button type="button" id="close-btn" class="btn btn-close embed-only" title="Close (esc)" hidden
          aria-label="Close">
          <kbd class="esc-kbd">esc</kbd>
        </button>
      </div>
    </header>

    <main class="submit-content">
      <!-- Submit form section -->
      <section class="submit-form-section" id="form-section">
        <div class="form-container">
          <h1 class="form-title">Got one we should see?</h1>
          <p class="form-subtitle">
            Know a website worth featuring?<br>
            Share it with us! We review every submission.
          </p>

          <form id="submit-form" class="submit-form">
            <div class="form-group">
              <label for="website-url" class="form-label">
                Website URL
                <span class="required-indicator">*</span>
              </label>
              <input
                type="url"
                id="website-url"
                name="url"
                placeholder="https://example.com"
                required
                class="form-input"
              />
              <span class="form-error" id="url-error"></span>
            </div>

            <div class="form-group">
              <label for="short-description" class="form-label">
                Short description
              </label>
              <textarea
                id="short-description"
                name="description"
                placeholder="What is this site about in one short sentence?"
                rows="3"
                class="form-input form-textarea"
              ></textarea>
              <span class="form-error" id="description-error"></span>
            </div>

            <div class="form-group">
              <label for="category" class="form-label">
                Category
                <span class="required-indicator">*</span>
              </label>
              <select id="category" name="category" required class="form-input form-select">
                <option value="">Select a category</option>
              </select>
              <span class="form-error" id="category-error"></span>
            </div>

            <div class="form-group">
              <label for="why-feature" class="form-label">
                Why is this site worth featuring?
              </label>
              <textarea
                id="why-feature"
                name="why-feature"
                placeholder="Share what makes this site special..."
                rows="3"
                class="form-input form-textarea"
              ></textarea>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn-submit">Submit</button>
            </div>
          </form>

          <div id="submit-status" class="submit-status" hidden></div>
        </div>
      </section>
    </main>

    <div class="bottom-fade" aria-hidden="true"></div>
  </div>

  <script type="module" src="submit.js"></script>
</body>

</html>
