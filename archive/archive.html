<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>savault</title>
  <link rel="stylesheet" href="archive.css" />
</head>

<body>
  <div class="app">
    <header class="header">
      <a class="brand" href="https://savault.framer.website" target="_blank" rel="noopener noreferrer" aria-label="savault">
        <svg class="brand-mark" width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M0.0213035 13.613L0.0105033 7.93542C0.0101496 6.98701 0.0301447 5.94323 0.00000285311 5.00143C0.104846 4.9987 0.224352 4.99978 0.330964 5.00558C1.35456 5.06114 2.47133 4.88386 3.43921 5.28849C3.64906 5.37623 3.86087 5.4419 4.03334 5.59344C4.93033 6.38165 5.73499 7.27042 6.58331 8.11109L11.9102 13.4145C12.6545 14.1655 13.5613 14.8489 14.1961 15.7196C14.8844 16.6636 14.4097 18.0862 14.8727 18.928C14.9999 19.1596 15.1521 19.3761 15.3266 19.5733C15.5799 19.862 15.9389 20.199 16.2149 20.4693L17.6851 21.8939C18.1205 22.3094 18.5262 22.741 18.9922 23.1233C19.7044 23.7078 20.6919 23.5388 21.5447 23.5701C21.7325 23.577 22.3504 23.5804 22.4878 23.5008C22.5009 23.2952 21.7263 22.6103 21.5489 22.4328L19.7586 20.6365C19.3337 20.2163 18.8999 19.7989 18.4928 19.351C17.7131 18.4935 17.6478 16.8393 18.2811 15.8843C18.6622 15.3096 19.3161 14.727 19.7986 14.2388L21.7937 12.197L24.234 9.70421C24.6293 9.297 25.1119 8.74006 25.5303 8.37307C26.2844 7.57232 27.0692 6.78421 27.8374 5.99674C28.0997 5.72796 28.4465 5.47224 28.7849 5.31266C29.0153 5.20133 29.2596 5.12194 29.5107 5.07662C29.8342 5.02143 31.6829 4.96598 31.9041 5.04877C31.9961 5.15819 31.9699 7.29906 31.9699 7.61308C31.9588 8.86018 31.9675 10.1074 31.9961 11.3542C32.0029 11.8059 32.0004 12.3122 31.9922 12.7735C31.964 13.733 32.0777 14.8409 31.752 15.7538C31.4947 16.4755 30.7975 17.1384 30.2781 17.6833L28.5175 19.5036C26.5066 21.5776 24.447 23.6072 22.4644 25.7036C21.6304 26.5856 20.8431 27.0003 19.6164 26.9966C17.9977 26.9918 16.359 27.0148 14.7413 26.9821C13.8059 26.9356 12.8827 27.0842 11.9678 26.8196C11.012 26.5433 10.4622 25.7866 9.78326 25.1205L7.47418 22.8608L1.51626 17.024C0.2666 15.7885 0.0452701 15.3905 0.0213035 13.613Z" fill="currentColor" />
        </svg>
      </a>
      <nav class="header-nav" aria-label="savault actions">
        <button type="button" id="submit-find-btn" class="header-link">Submit a find</button>
      </nav>
      <div class="header-actions">
        <button type="button" id="personal-vault-btn" class="open-link">My vault</button>
        <button type="button" id="view-toggle" class="btn btn-icon btn-toggle" data-view="grid" title="Grid view"
          aria-label="Grid view. Click to switch to list.">
          <span class="view-toggle-icon" aria-hidden="true"></span>
        </button>
        <button type="button" id="refresh-btn" class="btn btn-icon" title="Refresh archive"
          aria-label="Refresh archive">
          <span class="refresh-icon" aria-hidden="true"></span>
        </button>
        <button type="button" id="close-btn" class="btn btn-close embed-only" title="Close (esc)" hidden
          aria-label="Close">
          <kbd class="esc-kbd">esc</kbd>
        </button>
      </div>
    </header>

    <section class="hero">
      <div class="hero-copy">
        <h1 class="hero-title">Never lose a great design find again.</h1>
        <p class="hero-subtitle">
          Savault collects inspiring websites, tools, and resources so your best references don't get lost in tabs.
        </p>
        <div class="hero-actions">
          <button type="button" id="share-vault-btn" class="primary-cta share-vault-cta">Browse all</button>
          <button type="button" id="saved-finds-btn" class="text-cta">Saved finds</button>
        </div>
      </div>
      <div class="hero-ascii" aria-hidden="true"></div>
    </section>

    <section class="toolbar" aria-label="Archive controls">
      <div class="toolbar-label">
        <span>Browse archive</span>
        <a href="https://savault.framer.website" target="_blank" rel="noopener noreferrer">Open site</a>
      </div>
      <label class="search">
        <span class="sr-only">Search</span>
        <span class="search-icon" id="search-icon" aria-hidden="true"></span>
        <input type="search" id="search" placeholder="Search tools, sites..." autocomplete="off" />
      </label>
      <div class="filter-row">
        <div class="filter-select">
          <label class="sr-only" for="category-filter">Category</label>
          <select id="category-filter" aria-label="Filter by category">
            <option value="All">All categories</option>
          </select>
          <span class="filter-chevron" id="category-chevron" aria-hidden="true"></span>
        </div>
        <div class="filter-select">
          <label class="sr-only" for="pricing-filter">Pricing</label>
          <select id="pricing-filter" aria-label="Filter by pricing type">
            <option value="All">All pricing</option>
          </select>
          <span class="filter-chevron" id="pricing-chevron" aria-hidden="true"></span>
        </div>
        <label class="filter-checkbox" title="Show only new items">
          <input type="checkbox" id="new-filter" class="sr-only" />
          <span class="filter-checkbox-btn">New</span>
        </label>
        <label class="filter-checkbox filter-checkbox-icon" title="Show only saved items">
          <input type="checkbox" id="bookmarks-filter" class="sr-only" />
          <span class="filter-checkbox-btn" id="bookmarks-filter-btn"></span>
        </label>
      </div>
    </section>

    <!-- vault-browse moved to bottom of page -->

    <main class="main-scroll" id="saved-results">
      <div class="feed-header">
        <span>Saved finds</span>
        <button type="button" id="clear-category-btn" hidden>All finds</button>
      </div>
      <div id="status" class="status" hidden></div>
      <div id="grid" class="grid view-grid" role="list"></div>
    </main>
    <!-- Reinserted category browse at bottom -->
    <section class="vault-browse" aria-labelledby="vault-heading">
      <h2 id="vault-heading">Browse by category</h2>
      <div class="vault-categories" role="list">
        <button type="button" class="vault-tile" data-category="Tools" role="listitem"><span>Tools</span></button>
        <button type="button" class="vault-tile" data-category="Inspiration" role="listitem"><span>Inspiration</span></button>
        <button type="button" class="vault-tile" data-category="Resources" role="listitem"><span>Resources</span></button>
        <button type="button" class="vault-tile" data-category="Platforms" role="listitem"><span>Platforms</span></button>
        <button type="button" class="vault-tile" data-category="Libraries" role="listitem"><span>Libraries</span></button>
        <button type="button" class="vault-tile" data-category="Experimental" role="listitem"><span>Experimental</span></button>
      </div>
    </section>

    <div class="bottom-fade" aria-hidden="true"></div>
  </div>

  <script type="module" src="archive.js"></script>
</body>

</html>
